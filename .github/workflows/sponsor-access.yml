name: sponsor-access
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - run: python sponsor_access.py
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_GH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
