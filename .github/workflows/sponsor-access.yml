name: sponsor-access
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write  # only to keep this scheduled workflow from being disabled after 60 days without commits
concurrency: sponsor-access
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - run: python sponsor_access.py
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_GH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        # GitHub disables schedules in public repositories after 60 days without activity; re-enabling resets that.
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sponsor-access.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
